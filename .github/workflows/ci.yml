name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Never let two deploys race each other onto gh-pages.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      # CI=true promotes ESLint warnings to errors, so this also lints.
      - name: Build
        run: npm run build
        env:
          CI: true

      # Hand the exact tested artifact to the deploy job rather than
      # rebuilding, so what ships is what passed.
      - name: Upload build
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    environment:
      name: github-pages
      url: https://engahmedmoustafasadek.github.io/Testing_portfolio/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      # Same tool the local `npm run deploy` uses, so a workflow deploy and a
      # manual one behave identically. Installed on its own to avoid a full
      # `npm ci` for a single dev dependency.
      - name: Publish to gh-pages
        run: >
          npx --yes gh-pages@6
          --dist build
          --message "Deploy ${GITHUB_SHA} [skip ci]"
          --user "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
        env:
          GITHUB_SHA: ${{ github.sha }}
